---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: hypervmachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: HyperVMachine
    listKind: HyperVMachineList
    plural: hypervmachines
    shortNames:
    - hvm
    singular: hypervmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster to which this HyperVMachine belongs
      jsonPath: .metadata.labels['cluster\.x-k8s\.io/cluster-name']
      name: Cluster
      type: string
    - description: Machine ready status
      jsonPath: .status.initialization.provisioned
      name: Ready
      type: string
    - description: Hyper-V VM state
      jsonPath: .status.vmState
      name: State
      type: string
    - description: Provider ID
      jsonPath: .spec.providerID
      name: ProviderID
      type: string
    - description: Machine object which owns this HyperVMachine
      jsonPath: .metadata.ownerReferences[?(@.kind=="Machine")].name
      name: Machine
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HyperVMachine is the Schema for the hypervmachines API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the HyperVMachine spec.
            properties:
              cpuCount:
                default: 2
                description: cpuCount is the number of virtual processors assigned
                  to the VM.
                format: int32
                minimum: 1
                type: integer
              diskSizeGB:
                description: |-
                  diskSizeGB optionally resizes the copied OS disk to this many gigabytes.
                  Hyper-V can only grow a VHDX, so the value must be larger than the base
                  image's virtual size. When unset the disk keeps the base image size.
                format: int32
                minimum: 1
                type: integer
              enableSecureBoot:
                default: false
                description: |-
                  enableSecureBoot controls UEFI Secure Boot on the Generation 2 VM. Most
                  Linux cloud images require the Microsoft UEFI CA template, which the
                  provider selects when Secure Boot is enabled; many images boot more
                  reliably with it disabled. Defaults to disabled.
                type: boolean
              generation:
                default: 2
                description: |-
                  generation is the Hyper-V VM generation. Only Generation 2 (UEFI/SCSI) is
                  supported, because the NoCloud cidata ISO is attached to a SCSI DVD drive
                  and Generation 2 VMs have no IDE controller.
                enum:
                - 2
                format: int32
                type: integer
              image:
                description: |-
                  image is the path, on the Hyper-V host, to the cloud-init enabled base
                  VHDX used as the VM's operating system disk. The provider copies this image
                  for each VM it creates. The file must exist on the host; the provider does
                  not download or build it.
                minLength: 1
                type: string
              memoryMiB:
                default: 2048
                description: memoryMiB is the startup memory of the VM, in MiB.
                format: int32
                minimum: 512
                type: integer
              providerID:
                description: |-
                  providerID is the Hyper-V VM identity formatted as hyperv://<vm-guid>,
                  where <vm-guid> is the Hyper-V virtual machine Id (a GUID) as reported by
                  Get-VM. It is set by the controller once the VM exists.
                type: string
              switchName:
                description: |-
                  switchName is the name of the Hyper-V virtual switch to attach the VM's
                  network adapter to.
                minLength: 1
                type: string
              vlanID:
                description: vlanID optionally sets an 802.1Q VLAN access ID on the
                  VM's network adapter.
                format: int32
                maximum: 4094
                minimum: 1
                type: integer
              vmName:
                description: |-
                  vmName is the name the VM has (or will have) on the Hyper-V host. When set,
                  the provider looks up an existing VM by this exact name and adopts it if it
                  already exists; otherwise it creates one with this name. This is the key to
                  the "boot node zero out of band, then let the provider adopt it" workflow.
                  When empty, the provider derives the name from the owning Machine's name.
                maxLength: 100
                type: string
            required:
            - image
            - switchName
            type: object
          status:
            description: status is the HyperVMachine status.
            properties:
              addresses:
                description: addresses contains the associated addresses for the Hyper-V
                  VM.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              adopted:
                description: |-
                  adopted is true when the VM backing this machine was pre-existing on the
                  host and adopted by the provider rather than created by it.
                type: boolean
              conditions:
                description: conditions defines current service state of the HyperVMachine.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              initialization:
                description: |-
                  initialization provides observations of the HyperVMachine initialization
                  process. NOTE: fields in this struct are part of the Cluster API contract.
                minProperties: 1
                properties:
                  provisioned:
                    description: |-
                      provisioned is true when the infrastructure provider reports that the
                      Machine's infrastructure is fully provisioned.
                      NOTE: this field is part of the Cluster API contract.
                    type: boolean
                type: object
              vmState:
                description: vmState is the last observed provider view of the VM
                  state.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
