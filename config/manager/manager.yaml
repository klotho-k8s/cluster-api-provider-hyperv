apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    cluster.x-k8s.io/provider: infrastructure-hyperv
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    cluster.x-k8s.io/provider: infrastructure-hyperv
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      cluster.x-k8s.io/provider: infrastructure-hyperv
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: controller-manager
        cluster.x-k8s.io/provider: infrastructure-hyperv
    spec:
      # This manager drives Hyper-V through a host agent (hyperv-agent) reached
      # over gRPC, so it runs as an ordinary Linux pod on the management cluster
      # and executes no PowerShell itself. The agent connection is configured
      # through the three HYPERV_AGENT_* variables below, which klotho populates
      # from the provider configSecret; left empty (the defaults) the manager
      # would fall back to driving local PowerShell, which only works when it is
      # instead run directly on the Windows Hyper-V host.
      containers:
        - command:
            - /manager
          args:
            - --leader-elect
          image: controller:latest
          name: manager
          env:
            # gRPC endpoint (host:port) of the hyperv-agent on the Windows host.
            # When set, the manager drives Hyper-V through the agent instead of
            # local PowerShell.
            - name: HYPERV_AGENT_ENDPOINT
              value: "${HYPERV_AGENT_ENDPOINT:=}"
            # Bearer token presented on every agent RPC (shared with the agent).
            - name: HYPERV_AGENT_TOKEN
              value: "${HYPERV_AGENT_TOKEN:=}"
            # The agent's CA as a base64-encoded PEM. It is base64 so the
            # operator's ${VAR} substitution, which would mangle a multi-line
            # PEM, carries it intact; the manager decodes it in memory. Empty
            # means trust the host's system roots.
            - name: HYPERV_AGENT_CA
              value: "${HYPERV_AGENT_CA:=}"
          securityContext:
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
      serviceAccountName: manager
      terminationGracePeriodSeconds: 10
