# Top-level kustomization that assembles the provider's CRDs, RBAC and manager
# into a single manifest. clusterctl consumes this via the infrastructure
# components file built from `kustomize build config/default`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: capi-hyperv-system

namePrefix: capi-hyperv-

labels:
  - includeSelectors: false
    pairs:
      cluster.x-k8s.io/provider: infrastructure-hyperv

resources:
  - ../crd
  - ../rbac
  - ../manager
