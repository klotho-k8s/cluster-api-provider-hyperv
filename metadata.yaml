# This file maps provider release series to the Cluster API contract version
# they implement, so clusterctl and the Cluster API operator can determine
# compatibility. v1alpha1 of this provider targets the v1beta2 CAPI contract
# (Cluster API v1.11+).
apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3
kind: Metadata
releaseSeries:
  - major: 0
    minor: 1
    contract: v1beta2
